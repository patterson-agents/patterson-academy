<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/patterson-companies-design-system-3534f94f-a7e6-4612-81d4-6e830716f07d/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/patterson-companies-design-system-3534f94f-a7e6-4612-81d4-6e830716f07d/tokens/colors.css">
  <link rel="stylesheet" href="_ds/patterson-companies-design-system-3534f94f-a7e6-4612-81d4-6e830716f07d/tokens/typography.css">
  <link rel="stylesheet" href="_ds/patterson-companies-design-system-3534f94f-a7e6-4612-81d4-6e830716f07d/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/patterson-companies-design-system-3534f94f-a7e6-4612-81d4-6e830716f07d/tokens/effects.css">
  <link rel="stylesheet" href="_ds/patterson-companies-design-system-3534f94f-a7e6-4612-81d4-6e830716f07d/tokens/base.css">
  <link rel="stylesheet" href="_ds/patterson-companies-design-system-3534f94f-a7e6-4612-81d4-6e830716f07d/styles.css">
  <script src="_ds/patterson-companies-design-system-3534f94f-a7e6-4612-81d4-6e830716f07d/_ds_bundle.js"></script>
  <script src="academy-lab.js"></script>
  <script src="./doc-page.js"></script>
  <style>
    doc-page:not(:defined) { visibility: hidden; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    * { animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important; }
    a { color: #147EC2; text-decoration: none; }
    a:hover { color: #003767; text-decoration: underline; }
    .step, .phase-head, .sign-off { break-inside: avoid; }
    pre { break-inside: avoid; }
  </style>
</helmet>

<div class="no-print" style="font-family: proxima-nova, Figtree, Arial, sans-serif; padding: 14px 20px 0;">
  <a href="Claude Code Academy.dc.html" style="font-size: 13px; font-weight: 700; color: #003767;">&larr; Back to the Academy</a>
</div>

<doc-page margin="0.55in" data-screen-label="Lab worksheet">
  <div style="font-family: proxima-nova, Figtree, Arial, sans-serif; color: #3D4B57;">
    <header style="background: #003767; padding: 26px 30px 22px; margin-bottom: 22px;">
      <img src="assets/patterson-logo-white.svg" alt="Patterson" style="height: 16px; display: block; margin-bottom: 14px;">
      <div style="color: #00A8E1; font-size: 9.5px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 7px;">Patterson Academy &middot; Hands-on Lab</div>
      <h1 style="margin: 0 0 8px; color: #fff; font-size: 25px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15;">Set up Claude Code on a real repository</h1>
      <p style="margin: 0; color: #C9DCEA; font-size: 12px; line-height: 1.6; max-width: 480px;">{{ intro }}</p>
    </header>

    <sc-for list="{{ phases }}" as="ph" hint-placeholder-count="6">
      <section style="margin-bottom: 20px;">
        <div class="phase-head" style="display: flex; align-items: baseline; gap: 10px; border-top: 2px solid #003767; padding-top: 10px; margin-bottom: 4px;">
          <span style="font-size: 9px; font-weight: 800; letter-spacing: 0.1em; color: #fff; background: #003767; border-radius: 3px; padding: 2px 7px;">PHASE {{ ph.num }}</span>
          <h2 style="margin: 0; color: #003767; font-size: 15px; font-weight: 800;">{{ ph.title }}</h2>
        </div>
        <p style="margin: 0 0 10px; font-size: 11.5px; line-height: 1.55; color: #58585B;">{{ ph.goal }}</p>
        <div style="display: flex; flex-direction: column; gap: 9px;">
          <sc-for list="{{ ph.steps }}" as="st" hint-placeholder-count="4">
            <div class="step" style="display: flex; align-items: flex-start; gap: 11px;">
              <span style="flex: 0 0 auto; width: 14px; height: 14px; margin-top: 2px; border: 1.5px solid #99AFC2; border-radius: 3px;"></span>
              <div style="flex: 1; min-width: 0;">
                <div style="font-size: 12.5px; font-weight: 750; color: #003767; margin-bottom: 2px;">{{ st.title }}</div>
                <div>{{ st.bodyEl }}</div>
                <sc-if value="{{ st.hasCmd }}" hint-placeholder-val="{{ false }}">
                  <div style="margin-top: 4px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: #003767; background: #EFF3F7; border: 1px solid #DFE6EC; border-radius: 5px; padding: 3px 9px; display: inline-block;">{{ st.cmd }}</div>
                </sc-if>
                <div>{{ st.codeEl }}</div>
              </div>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <div class="sign-off" style="margin-top: 20px; padding-top: 12px; border-top: 1px solid #E1E7ED; display: flex; align-items: center; gap: 10px;">
      <img src="assets/patterson-logo-navy.svg" alt="Patterson" style="height: 12px;">
      <span style="font-size: 9.5px; color: #99AFC2; font-weight: 600;">Trusted Expertise. Unrivaled Support. &middot; Sources: code.claude.com/docs</span>
    </div>
  </div>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  styleBody(h) {
    return h
      .replace(/<code>/g, '<code style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.9em;background:#EFF3F7;border:1px solid #DFE6EC;border-radius:4px;padding:0 4px;color:#003767;">')
      .replace(/<strong>/g, '<strong style="color:#003767;font-weight:700;">');
  }
  renderVals() {
    const lab = window.ACADEMY_LAB || [];
    const total = lab.reduce((n, p) => n + p.steps.length, 0);
    return {
      intro: 'Six phases, ' + total + ' steps, done in your own project alongside the course. Work top to bottom and tick each step as you finish it.',
      phases: lab.map((p, pi) => ({
        num: String(pi + 1), title: p.title, goal: p.goal,
        steps: p.steps.map(st => ({
          title: st.title, hasCmd: !!st.cmd && !st.body.includes('<code>' + st.cmd + '</code>'), cmd: st.cmd || '',
          bodyEl: React.createElement('div', {
            style: { fontSize: '11.5px', lineHeight: 1.6, color: '#3D4B57' },
            dangerouslySetInnerHTML: { __html: this.styleBody(st.body) },
          }),
          codeEl: st.code ? React.createElement('pre', {
            style: { margin: '6px 0 0', padding: '9px 12px', background: '#F5F7F9', border: '1px solid #E1E7ED', borderRadius: '6px', fontFamily: 'ui-monospace, Menlo, Consolas, monospace', fontSize: '10.5px', lineHeight: 1.55, color: '#2E3B47', whiteSpace: 'pre-wrap' },
          }, st.code) : null,
        })),
      })),
    };
  }
}
</script>
</body>
</html>
