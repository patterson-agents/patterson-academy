      <path d="M0,0 L10,5 L0,10 z" fill="#58585B"></path>
    </marker>
    <marker id="arSky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00A8E1"></path>
    </marker>
  </defs>
  <rect width="720" height="280" fill="white"></rect>
  
  <rect x="24" y="106" width="118" height="68" rx="12" fill="#003767"></rect>
  <text x="83" y="134" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="700" fill="white">Your</text>
  <text x="83" y="153" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="700" fill="white">prompt</text>
  <line x1="142" y1="140" x2="182" y2="140" stroke="#58585B" stroke-width="2" marker-end="url(#ar)"></line>
  
  <rect x="188" y="42" width="500" height="196" rx="16" fill="#F4FAFE" stroke="#00A8E1" stroke-width="1.5" stroke-dasharray="6 5"></rect>
  <text x="438" y="66" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#147EC2">THE AGENTIC LOOP</text>
  
  <rect x="212" y="88" width="136" height="76" rx="12" fill="white" stroke="#147EC2" stroke-width="2"></rect>
  <text x="280" y="119" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="700" fill="#003767">Gather</text>
  <text x="280" y="138" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="700" fill="#003767">context</text>
  <rect x="372" y="88" width="136" height="76" rx="12" fill="white" stroke="#00A8E1" stroke-width="2"></rect>
  <text x="440" y="119" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="700" fill="#003767">Take</text>
  <text x="440" y="138" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="700" fill="#003767">action</text>
  <rect x="532" y="88" width="136" height="76" rx="12" fill="white" stroke="#7BC24D" stroke-width="2"></rect>
  <text x="600" y="119" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="700" fill="#003767">Verify</text>
  <text x="600" y="138" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="700" fill="#003767">results</text>
