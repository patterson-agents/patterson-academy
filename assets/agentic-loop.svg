  <path d="M600,164 L600,200 Q600,210 590,210 L290,210 Q280,210 280,200 L280,168" fill="none" stroke="#00A8E1" stroke-width="2" marker-end="url(#arSky)"></path>
  <text x="440" y="228" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="12" fill="#00817D" font-weight="600">repeat until the task is complete</text>
  
  <text x="83" y="196" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="11.5" fill="#58585B">You can interrupt</text>
  <text x="83" y="211" text-anchor="middle" font-family="Figtree, Arial, sans-serif" font-size="11.5" fill="#58585B">at any point (Esc)</text>
